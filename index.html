function openCard(i){ tries[i]=0;
  clearInterval(backT); clearAdv(); stopListen(); idx=i; $("app").classList.remove("sm"); $("app").classList.add("cm"); const s=S[i], o=order(), k=o.indexOf(i);
  $("app").innerHTML=`<div class="top"><span class="brand">${WORDS?`단어 쉐도잉 ${(S[i].wi||0)+1} / ${SET.w.length}`:`쉐도잉 ${k+1} / ${o.length}`}</span><button id="x" style="padding:6px 12px">✕</button></div>
  <div class="card"><div class="en" id="en">${esc(s.en)}</div><div class="ko">${esc(s.ko)}</div>${s.tip?`<div class="tip">${esc(s.tip)}</div>`:""}
    <div class="row"><button id="again">↻ 듣고 다시 말하기</button><button id="slow">🐢 천천히</button></div></div>
  <div class="stage"><button class="mic" id="mic" aria-label="말하기">🎤</button>
  <div class="status" id="st">문장을 들려줄게요…</div><div class="live" id="live"></div><div id="res" style="width:100%"></div></div>
  <div class="nav"><button id="prev" ${k<=0?"disabled":""}>◀ 이전</button><button id="next">${isLast()?"완료 ✓":"다음 ▶"}</button></div>`;
  $("x").onclick=()=>{stopListen();renderSummary();};
  $("again").onclick=()=>listenAfterSpeak();
  $("slow").onclick=()=>{stopListen();speak(s.en,0.65);};
  $("mic").onclick=()=>{ if(listening) stopListen(); else { clearAdv(); $("res").innerHTML=""; ["st","live"].forEach(k=>$(k).style.display=""); startListen(); } };
  $("prev").onclick=()=>{const o=order(),k=o.indexOf(idx);if(k>0)openCard(o[k-1]);};
  $("next").onclick=goNext;
  setVH();
  listenAfterSpeak();
}
function goNext(){const o=order(),k=o.indexOf(idx);if(k<o.length-1)openCard(o[k+1]);else{retry=null;renderSummary();}}
function listenAfterSpeak(){ clearAdv(); stopListen(); ["st","live","mic"].forEach(k=>$(k).style.display=""); $("st").textContent="🔊 잘 들어 보세요"; fit(); $("live").textContent=""; $("res").innerHTML=""; $("en").innerHTML=esc(S[idx].en);
  const my=idx; speak(S[idx].en,WORDS?0.85:0.95,()=>{ if(idx===my) startListen(); }); }
function startListen(){
  if(!SR) return; if(synth) synth.cancel();
  rec=new SR(); rec.lang="en-US"; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=3;
  let finalText="", alts=[], got=false;
  rec.onstart=()=>{listening=true;$("mic").classList.add("on");$("mic").textContent="⏹";$("st").textContent="🎙 지금 말하세요";};
  rec.onresult=e=>{ let interim="";for(let r=e.resultIndex;r<e.results.length;r++){const res=e.results[r];if(res.isFinal){finalText+=res[0].transcript;alts=[...res].map(a=>a.transcript);got=true;}else interim+=res[0].transcript;}
    $("live").textContent=(finalText+" "+interim).trim(); };
  rec.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){$("st").innerHTML="마이크가 막혀 있어요. 주소창 왼쪽 자물쇠 → 권한 → <b>마이크 허용</b>으로 바꿔 주세요.";} else if(e.error==="no-speech"){$("st").textContent="목소리가 안 들렸어요. 🎤를 눌러 다시 말해 보세요.";} else $("st").textContent="인식 오류: "+e.error; };
  rec.onend=()=>{ listening=false; const m=$("mic"); if(m){m.classList.remove("on");m.textContent="🎤";} if(got) score(finalText,alts); else if($("st") && $("st").textContent.startsWith("🎙")) $("st").textContent="목소리가 안 들렸어요. 🎤를 눌러 다시 말해 보세요."; };
  try{ rec.start(); }catch(e){}
}
function stopListen(){ if(rec){ try{rec.onend=null;rec.abort();}catch(e){} rec=null; } listening=false; const m=$("mic"); if(m){m.classList.remove("on");m.textContent="🎤";} }
function score(text,alts){
  const target=S[idx].en, t=norm(target).split(" ");
  let bestHit=null,bestN=-1,bestTxt=text;
  for(const a of [text,...alts]){ const g=norm(a).split(" ").filter(Boolean), h=lcs(t,g), n=h.filter(Boolean).length; if(n>bestN){bestN=n;bestHit=h;bestTxt=a;} }
  const pct=Math.round(bestN/t.length*100), words=target.split(/\s+/);
  if(words.length===t.length) $("en").innerHTML=words.map((w,k)=>`<span class="${bestHit[k]?"hit":"miss"}">${esc(w)}</span>`).join(" ");
  const before=best[idx]; if(before!=null && pct>before && gain[idx]==null) gain[idx]=before; best[idx]=before==null?pct:Math.max(before,pct);
  $("st").style.display="none"; $("live").style.display="none"; $("mic").style.display="none";
  $("res").innerHTML=`<div class="res ${pct>=70?"ok":"bad"}"><div class="num ${cls(pct)}">${pct}</div><div class="txt"><div class="verdict">${verdict(pct)}</div>
    <div class="small">들린 대로: "${esc(bestTxt)}"</div>${before!=null?(pct>before?`<div class="small" style="color:var(--ok)">최고 점수 갱신! ${before} → ${pct} 🎉</div>`:`<div class="small">최고 ${before}점은 그대로</div>`):""}
    <div class="row"><button id="retry1" class="${pct<70?"primary":""}">↻ 다시</button></div>
    <div class="small">${(pct<70 && pct<50 && (tries[idx]||0)<2)?"🔁 발음이 많이 달라요. 다시 듣고 한 번 더 해요":`${pct>=70?"3초 뒤":"🔊 원문을 한 번 듣고"} ${isLast()?"결과로":WORDS?"다음으로":"다음 문장으로"} 넘어가요`}</div>${pct>=70?`<div class="cnt"><i></i></div>`:""}</div></div>`;
  $("retry1").onclick=listenAfterSpeak;
  fit(); clearAdv(); const my=idx;
  if(pct>=70) advT=setTimeout(()=>{ if(idx===my && !listening) goNext(); }, WORDS?1500:3000);
  else if(pct<50 && (tries[idx]||0)<2){ tries[idx]=(tries[idx]||0)+1; advT=setTimeout(()=>{ if(idx===my && !listening && $("res") && $("res").innerHTML) listenAfterSpeak(); },2500); }
  else { let gone=false; const nx=()=>{ if(gone) return; gone=true; clearAdv(); advT=setTimeout(()=>{ if(idx===my && !listening && $("res") && $("res").innerHTML) goNext(); },2000); };
    unlocked=true; speak(S[idx].en,0.9,nx); advT=setTimeout(nx,9000); }
}
const APP_URL="https://claude.ai/artifact/81i7VdtutQ1RFNG7ErNrKf";
let backT=null;
function cancelBack(e){ if(e && e.target && e.target.closest && e.target.closest("#back")) return; clearInterval(backT); const el=$("cd"); if(el) el.textContent="눌러서 돌아가기"; }
function goBack(){ try{ window.close(); }catch(e){} setTimeout(()=>{ location.href=APP_URL; },300); }
function renderSummary(){ clearAdv(); $("app").classList.remove("cm"); $("app").classList.add("sm");
  stopListen(); const done=S.map((_,i)=>i).filter(i=>best[i]!=null);
  const avg=done.length?Math.round(done.reduce((a,i)=>a+best[i],0)/done.length):0;
  const rt=S.map((_,i)=>i).filter(i=>best[i]==null||best[i]<80); const col=avg>=90?"var(--ok)":avg>=70?"var(--accent)":"var(--bad)";
  $("app").innerHTML=`<div class="top"><span class="brand">${WORDS?"단어 쉐도잉 결과":"쉐도잉 결과"}</span><span></span></div>
  <div class="hero"><div class="ring" style="background:conic-gradient(${col} 0 ${avg}%,var(--line) ${avg}% 100%)"><span style="color:${col}">${avg}</span></div>
  <div><div style="font-size:19px;font-weight:800">${done.length===S.length?"🎉 쉐도잉 완료!":"수고했어요!"}</div>
  <div class="small">${WORDS?`<b>${SET.w.length}</b>단어 × 3번`:`<b>${done.length} / ${S.length}</b>문장`} · 평균 <b>${avg}점</b></div></div></div>
  <div class="list">${WORDS ? SET.w.map((w,wi)=>{ const ix=S.map((x,i)=>x.wi===wi?i:-1).filter(i=>i>=0), sc=ix.map(i=>best[i]), got=sc.filter(x=>x!=null), av=got.length?Math.round(got.reduce((a,b)=>a+b,0)/got.length):null;
    return `<div class="li"><b class="${av==null?"":cls(av)}">${av??"-"}</b><span class="s">${esc(w.en)}<br><span class="small">${sc.map(x=>x??"-").join(" · ")}</span></span>${(av==null||av<80)?`<button data-w="${wi}">다시</button>`:"👍"}</div>`; }).join("") : S.map((s,i)=>`<div class="li"><b class="${best[i]==null?"":cls(best[i])}">${best[i]??"-"}</b><span class="s">${esc(s.en)}${gain[i]!=null?`<br><span class="small" style="color:var(--ok)">${gain[i]} → ${best[i]} ↑</span>`:""}</span>${(best[i]==null||best[i]<80)?`<button data-i="${i}">다시</button>`:"👍"}</div>`).join("")}</div>
  ${rt.length?"":`<div class="small" style="text-align:center">모든 문장 80점 이상! 완벽해요</div>`}
  <div class="nav">${rt.length?`<button class="primary" id="ra">80점 미만 ${rt.length}개 다시</button>`:`<button id="re">처음부터 다시</button>`}<button id="home">처음 화면</button></div>
  <a class="back" id="back" href="${APP_URL}">↩ 웹앱으로 돌아가기 <small id="cd">3초 뒤 자동으로 돌아가요</small></a>`;
  clearInterval(backT); let c=3; backT=setInterval(()=>{ c--; const el=$("cd"); if(!el){clearInterval(backT);return;} if(c<=0){ clearInterval(backT); goBack(); } else el.textContent=c+"초 뒤 자동으로 돌아가요"; },1000);
  $("back").onclick=e=>{ e.preventDefault(); clearInterval(backT); goBack(); };
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ const ix=S.map((x,i)=>x.wi===+b.dataset.w?i:-1).filter(i=>i>=0); retry=ix; openCard(ix[0]); });
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{retry=[+b.dataset.i];openCard(+b.dataset.i);});
  if($("ra")) $("ra").onclick=()=>{retry=rt;openCard(rt[0]);};
  if($("re")) $("re").onclick=()=>{retry=null;openCard(0);};
  $("home").onclick=renderStart; setVH();
}

/* ---------- 대화 퀴즈 모드 ---------- */
const TALK = SET.mode==="talk" ? SET : null;
let qi=0, qbest=[], qadv=null;
function talkLines(it){ return (TALK.g&&TALK.g[it.g])||[]; }
function openTalk(i){
  clearInterval(backT); clearTimeout(qadv); stopListen(); qi=i; const it=TALK.items[i], n=TALK.items.length;
  $("app").classList.remove("sm"); $("app").classList.add("cm");
  let body="";
  if(it.t==="one") body=`<span class="qsec">딱! 한 줄 말하기</span>${it.situ?`<div class="situ">${esc(it.situ)}</div>`:""}<div class="qko">${esc(it.ko)}</div>`;
  else if(it.t==="try") body=`<span class="qsec try">Try it!</span><div class="situ">오늘의 표현 <b>${esc(it.hint)}</b>을 활용해 보세요.</div><div class="qko">${esc(it.ko)}</div>`;
  else { const L=talkLines(it); body=`<span class="qsec ${it.t==="ttry"?"try":""}">${it.t==="ttry"?"Try it! 회화":"세 줄 회화"} ${it.idx+1}/${L.length}</span><div class="ctx">${L.map((l,k)=>k<it.idx?`<div><span class="ab">${esc(l.who)}</span>${esc(l.en)}</div>`:k===it.idx?`<div class="cur"><span class="ab">${esc(l.who)}</span>${esc(l.ko)}</div>`:`<div class="dim"><span class="ab">${esc(l.who)}</span>${esc(l.ko)}</div>`).join("")}</div>`; }
  const right=qbest.filter(x=>x!=null&&x>=70).length;
  $("app").innerHTML=`<div class="top"><span class="brand">대화 퀴즈 ${i+1} / ${n}${TALK.name?" · "+esc(TALK.name):""}</span><button id="x" style="padding:6px 12px">✕</button></div>
  <div class="card" id="qcard">${body}<div class="model" id="en" hidden></div></div>
  <div class="stage"><button class="mic" id="mic" aria-label="말하기">🎤</button>
  <div class="status" id="st">영어로 말해 보세요</div><div class="live" id="live"></div><div id="res" style="width:100%"></div></div>
  <div class="nav"><button id="skip">모르겠어요</button><button id="next">${i===n-1?"결과 보기":"다음 ▶"}</button></div>`;
  $("x").onclick=()=>{stopListen();talkSummary();};
  $("mic").onclick=()=>{ if(listening) stopListen(); else { clearTimeout(qadv); $("res").innerHTML=""; ["st","live"].forEach(k=>$(k).style.display=""); talkListen(); } };
  $("skip").onclick=()=>{ stopListen(); talkResult(0,"",true); };
  $("next").onclick=talkNext;
  setVH(); setTimeout(()=>{ if(qi===i) talkListen(); },700);
}
function talkNext(){ clearTimeout(qadv); if(qi<TALK.items.length-1) openTalk(qi+1); else talkSummary(); }
function talkListen(){
  if(!SR) return; if(synth) synth.cancel();
  rec=new SR(); rec.lang="en-US"; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=3;
  let finalText="", alts=[], got=false;
  rec.onstart=()=>{listening=true;$("mic").classList.add("on");$("mic").textContent="⏹";$("st").textContent="🎙 지금 영어로 말하세요";};
  rec.onresult=e=>{ let interim="";for(let r=e.resultIndex;r<e.results.length;r++){const res=e.results[r];if(res.isFinal){finalText+=res[0].transcript;alts=[...res].map(a=>a.transcript);got=true;}else interim+=res[0].transcript;} $("live").textContent=(finalText+" "+interim).trim(); };
  rec.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed") $("st").innerHTML="마이크가 막혀 있어요. 주소창 왼쪽 자물쇠 → 권한 → <b>마이크 허용</b>"; else if(e.error==="no-speech") $("st").textContent="목소리가 안 들렸어요. 🎤를 눌러 말해 보세요."; else $("st").textContent="인식 오류: "+e.error; };
  rec.onend=()=>{ listening=false; const m=$("mic"); if(m){m.classList.remove("on");m.textContent="🎤";} if(got){ const it=TALK.items[qi], t=norm(it.en).split(" "); let bn=-1,bt=finalText; for(const a of [finalText,...alts]){ const g=norm(a).split(" ").filter(Boolean), n=lcs(t,g).filter(Boolean).length; if(n>bn){bn=n;bt=a;} } talkResult(Math.round(bn/t.length*100), bt, false); } else if($("st") && $("st").textContent.startsWith("🎙")) $("st").textContent="목소리가 안 들렸어요. 🎤를 눌러 말해 보세요."; };
  try{ rec.start(); }catch(e){}
}
function talkResult(pct, heard, skipped){
  const it=TALK.items[qi], i=qi; qbest[i]=Math.max(qbest[i]??0,pct);
  const ok=pct>=70;
  const en=$("en"); en.hidden=false; en.innerHTML=`정답 · ${esc(it.en)}`;
  $("st").style.display="none"; $("live").style.display="none"; $("mic").style.display="none";
  $("res").innerHTML=`<div class="res ${ok?"ok":"bad"}"><div class="num ${cls(pct)}">${skipped?"–":pct}</div><div class="txt"><div class="verdict">${skipped?"🙈 정답을 듣고 따라 해 보세요":ok?(pct>=90?"😎 정답!":"🙂 정답!"):"😅 아쉬워요"}</div>
    ${heard?`<div class="small">들린 대로: "${esc(heard)}"</div>`:""}
    <div class="row"><button id="retry1" class="${ok?"":"primary"}">↻ 다시</button></div>
    <div class="small">${ok?"3초 뒤":"🔊 정답을 듣고"} ${i===TALK.items.length-1?"결과로":"다음 문제로"} 넘어가요</div>${ok?`<div class="cnt"><i></i></div>`:""}</div></div>`;
  $("retry1").onclick=()=>{ clearTimeout(qadv); if(synth) synth.cancel(); $("res").innerHTML=""; en.hidden=true; ["st","live","mic"].forEach(k=>$(k).style.display=""); fit(); talkListen(); };
  fit(); clearTimeout(qadv);
  let armed=false; const arm=()=>{ if(armed) return; armed=true; if(qi===i && $("res") && $("res").innerHTML) qadv=setTimeout(()=>{ if(qi===i && !listening) talkNext(); },ok?3000:2000); };
  if(ok) arm(); else { unlocked=true; speak(it.en,0.9,arm); setTimeout(arm, 9000); }
}
function talkSummary(){
  clearTimeout(qadv); stopListen(); $("app").classList.remove("cm"); $("app").classList.add("sm");
  const n=TALK.items.length, right=qbest.filter(x=>x!=null&&x>=70).length, pct=Math.round(right/n*100), col=pct>=90?"var(--ok)":pct>=70?"var(--accent)":"var(--bad)";
  const back=APP_URL+(TALK.who&&TALK.date?`#talk-${TALK.who}-${TALK.date.replace(/-/g,"")}-${right}-${n}`:"");
  $("app").innerHTML=`<div class="top"><span class="brand">대화 퀴즈 결과</span><span></span></div>
  <div class="hero"><div class="ring" style="background:conic-gradient(${col} 0 ${pct}%,var(--line) ${pct}% 100%)"><span style="color:${col};font-size:24px">${right}/${n}</span></div>
  <div><div style="font-size:19px;font-weight:800">${right===n?"🎉 만점!":"💬 퀴즈 완료!"}</div><div class="small">정답 <b>${right}</b> / ${n}문제${TALK.scored?" · 웹앱에 점수 기록":""}</div></div></div>
  <div class="list">${TALK.items.map((it,i)=>`<div class="li"><b class="${qbest[i]==null?"":cls(qbest[i])}">${qbest[i]==null?"-":qbest[i]>=70?"○":"✕"}</b><span class="s">${esc(it.en)}</span>${qbest[i]!=null&&qbest[i]>=70?"👍":`<button data-q="${i}">다시</button>`}</div>`).join("")}</div>
  <div class="nav" style="grid-template-columns:1fr"><button id="qa">처음부터 다시</button></div>
  <a class="back" id="back" href="${back}">↩ 웹앱으로 돌아가기 <small id="cd">3초 뒤 자동으로 돌아가요</small></a>`;
  const go=()=>{ clearInterval(backT); location.href=back; };
  clearInterval(backT); let c=3; backT=setInterval(()=>{ c--; const el=$("cd"); if(!el){clearInterval(backT);return;} if(c<=0) go(); else el.textContent=c+"초 뒤 자동으로 돌아가요"; },1000);
  $("back").onclick=e=>{e.preventDefault();go();};
  $("qa").onclick=()=>{ qbest=[]; openTalk(0); };
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>openTalk(+b.dataset.q));
  setVH();
}

if(TALK){ if(SR) openTalk(0); else { $("app").innerHTML=`<div class="warn">이 브라우저는 음성 인식을 지원하지 않아요. 크롬(Chrome)으로 열어 주세요.</div>`; } }
else if(location.hash.length>2 && SR){ retry=null; openCard(0); } else renderStart();
</script></body></html>
